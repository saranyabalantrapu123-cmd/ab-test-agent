# Pre-registered experiment metadata — what an experimenter writes BEFORE the test runs.
# The planted ground truth used to simulate each test lives in data/ground_truth.yaml
# (generated by scripts/generate_experiments.py) and is never shown to the agent.

# Metric registry shared by every experiment.
#   type: proportion -> two-proportion z-test; mean -> Welch t-test + bootstrap CI
#   higher_is_better: direction that counts as an improvement
#   cuped_covariate: optional pre-period column used for CUPED variance reduction
metrics:
  conversion_rate:
    column: converted
    type: proportion
    higher_is_better: true
    description: Share of assigned users who completed a purchase or activation.
  revenue_per_user:
    column: revenue
    type: mean
    higher_is_better: true
    cuped_covariate: pre_revenue
    description: Revenue (USD) per assigned user, including non-buyers as zero.
  support_contact_rate:
    column: support_contact
    type: proportion
    higher_is_better: false
    description: Share of assigned users who contacted customer care within 7 days.
  sessions_per_user:
    column: sessions
    type: mean
    higher_is_better: true
    cuped_covariate: pre_sessions
    description: App or web sessions per assigned user during the test.

# Segment dimensions available for heterogeneity analysis.
segments: [platform, brand, new_vs_returning]

experiments:
  exp_checkout_redesign:
    name: One-page checkout redesign
    brand_scope: Nimbus Wireless + Nimbus Prepaid
    hypothesis: >-
      Collapsing the three-step device checkout into a single page reduces friction
      and increases checkout conversion.
    primary_metric: conversion_rate
    guardrail_metrics: [revenue_per_user, support_contact_rate]
    mde_relative: 0.10
    alpha: 0.05
    power: 0.80
    expected_split: [0.5, 0.5]
    start_date: "2026-03-02"
    planned_duration_days: 14

  exp_plan_page_copy:
    name: Plan comparison page copy refresh
    brand_scope: Nimbus Wireless + Nimbus Prepaid
    hypothesis: >-
      Rewriting plan comparison copy in plain language helps customers pick a plan
      and increases plan-change conversion.
    primary_metric: conversion_rate
    guardrail_metrics: [revenue_per_user, support_contact_rate]
    mde_relative: 0.10
    alpha: 0.05
    power: 0.80
    expected_split: [0.5, 0.5]
    start_date: "2026-03-09"
    planned_duration_days: 14

  exp_autopay_banner:
    name: AutoPay enrollment banner
    brand_scope: Nimbus Wireless + Nimbus Prepaid
    hypothesis: >-
      A persistent AutoPay banner on the bill-pay screen increases AutoPay enrollment
      without increasing care contacts.
    primary_metric: conversion_rate
    guardrail_metrics: [revenue_per_user, support_contact_rate]
    mde_relative: 0.10
    alpha: 0.05
    power: 0.80
    expected_split: [0.5, 0.5]
    start_date: "2026-04-06"
    planned_duration_days: 14

  exp_discount_nudge:
    name: Accessory discount nudge at checkout
    brand_scope: Nimbus Wireless + Nimbus Prepaid
    hypothesis: >-
      Offering a 30% accessory discount at checkout increases accessory attach
      (conversion) and grows revenue per user.
    primary_metric: conversion_rate
    guardrail_metrics: [revenue_per_user, support_contact_rate]
    mde_relative: 0.10
    alpha: 0.05
    power: 0.80
    expected_split: [0.5, 0.5]
    start_date: "2026-04-20"
    planned_duration_days: 14

  exp_app_onboarding:
    name: Guided onboarding for new lines
    brand_scope: Nimbus Wireless + Nimbus Prepaid
    hypothesis: >-
      A guided activation flow for new lines increases activation conversion across
      app and web.
    primary_metric: conversion_rate
    guardrail_metrics: [revenue_per_user, support_contact_rate]
    mde_relative: 0.10
    alpha: 0.05
    power: 0.80
    expected_split: [0.5, 0.5]
    start_date: "2026-05-04"
    planned_duration_days: 14

  exp_family_bundle:
    name: Family plan bundle upsell
    brand_scope: Nimbus Prepaid
    hypothesis: >-
      Showing a family-plan bundle offer to prepaid customers increases bundle
      conversion.
    primary_metric: conversion_rate
    guardrail_metrics: [revenue_per_user, support_contact_rate]
    mde_relative: 0.10
    alpha: 0.05
    power: 0.80
    expected_split: [0.5, 0.5]
    start_date: "2026-05-18"
    planned_duration_days: 14
